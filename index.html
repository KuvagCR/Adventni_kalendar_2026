<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#702D3B">
<title>KUVAG | Adventní kalendář 2026</title>
<style>
:root{--forest:#702D3B;--deep:#4B1F2B;--gold:#d8b66a;--cream:#fff8e9;--red:#8c3c35;--ink:#26352e}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--cream);font-family:Georgia,'Times New Roman',serif;background:linear-gradient(90deg,rgba(30,10,18,.30),rgba(30,10,18,.14) 50%,rgba(30,10,18,.30)),url("vanocni-pozadi.jpg.png") center/cover fixed no-repeat,linear-gradient(145deg,#56303B,#2B1720);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(30,10,18,.14),rgba(30,10,18,.30));pointer-events:none;z-index:0}body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:radial-gradient(2px 2px at 8% 18%,#fff 99%,transparent),radial-gradient(2px 2px at 22% 72%,#fff 99%,transparent),radial-gradient(3px 3px at 38% 34%,#fff 99%,transparent),radial-gradient(2px 2px at 57% 12%,#fff 99%,transparent),radial-gradient(2px 2px at 73% 63%,#fff 99%,transparent),radial-gradient(3px 3px at 91% 29%,#fff 99%,transparent),radial-gradient(2px 2px at 84% 88%,#fff 99%,transparent);background-size:320px 260px;z-index:0}
.wrap{position:relative;z-index:1;width:min(1100px,92vw);margin:auto;padding:55px 0 70px}.top{text-align:center;margin-bottom:30px}.brand-logo{display:block;box-sizing:border-box;width:auto;height:auto;max-width:min(230px,58vw);max-height:112px;object-fit:contain;margin:0 auto 22px;padding:12px 22px;background:rgba(255,250,235,.96);border:1px solid #d8bd80;border-radius:12px;box-shadow:0 5px 22px #081c1680}.eyebrow{color:#e8cc8c;letter-spacing:.28em;text-transform:uppercase;font:600 11px Arial,sans-serif}.top h1{font-size:clamp(38px,7vw,68px);line-height:1.02;margin:14px 0 10px;font-weight:normal;text-shadow:0 4px 24px #081c16}.top p{font:15px/1.6 Arial,sans-serif;color:#fff8e9;margin:0;text-shadow:0 2px 8px #17251f}.rule{width:100px;height:1px;background:var(--gold);margin:22px auto}.countdown{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:24px auto 30px}.countdown span{display:block;min-width:76px;padding:10px 12px;border:1px solid #f1dca4aa;border-radius:12px;background:rgba(75,31,43,.82);box-shadow:0 5px 18px #08171355}.countdown b{display:block;color:#ffe3a0;font:normal 27px Georgia,serif}.countdown small{display:block;margin-top:3px;color:#fff4db;font:9px Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;max-width:900px;margin:0 auto}
.door{position:relative;min-height:112px;border:1px solid #f0d79a;border-radius:13px;background:linear-gradient(145deg,rgba(255,250,235,.96),rgba(232,216,181,.94));color:#542431;cursor:pointer;box-shadow:0 9px 24px #071a1477;transition:transform .2s,box-shadow .2s;overflow:hidden}
.door:hover{transform:translateY(-5px);box-shadow:0 14px 26px #071a1499}.door:before{content:"";position:absolute;inset:7px;border:1px solid #b99555aa;border-radius:8px;pointer-events:none}.door .num{display:block;color:#61283A;font:normal 46px Georgia;margin-top:12px}.door .symbol{display:none}.door .hint{display:inline-block;margin-top:9px;padding:5px 10px;border-radius:20px;background:#e6d4aa;color:#5d4727;font:9px Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase}.door.opened{background:linear-gradient(145deg,rgba(39,83,63,.96),rgba(21,54,43,.96));border-color:#f4d58c;color:#fff8e9}.door.opened .num{color:#ffe2a0}.door.opened .hint{background:#e8d7ad;color:#314b3c}.door.locked{opacity:.82;cursor:not-allowed}.door.locked .hint{background:#d6d0c2;color:#55584f}.door.locked:hover{transform:none}
.note{text-align:center;color:#d7d2c4;font:12px Arial,sans-serif;margin:23px 0 0}
footer{text-align:center;color:#c9c0a8;font:11px Arial,sans-serif;letter-spacing:.12em;margin-top:38px}
.modal{position:fixed;inset:0;background:#06130fe8;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal.show{display:flex}.panel{width:min(520px,100%);background:linear-gradient(160deg,#fff8e9,#f0e3c8);color:var(--ink);border:2px solid var(--gold);border-radius:18px;padding:34px 28px;text-align:center;box-shadow:0 20px 80px #0009;position:relative}.close{position:absolute;right:15px;top:12px;border:0;background:none;color:#52645a;font-size:26px;cursor:pointer}.panel .day{font:11px Arial,sans-serif;letter-spacing:.25em;text-transform:uppercase;color:#94713d}.panel h2{font-size:clamp(27px,5vw,39px);font-weight:normal;margin:12px 0;color:var(--forest)}.panel .intro{font:14px Arial,sans-serif;color:#59675d}.winners{display:grid;gap:12px;margin:24px 0}.winner{border:1px solid #d6c49e;border-radius:12px;padding:14px;background:#fffdf6}.winner strong{display:block;color:#61283A;font-size:21px;font-weight:normal}.winner span{display:block;font:13px Arial,sans-serif;color:#756345;margin-top:5px}.gift{font-size:29px;margin:14px 0 5px}.giftname{font:16px Arial,sans-serif;font-weight:bold;color:#684b25}.wisdom{margin:22px 0 4px;padding:16px 18px;border-top:1px solid #d6c49e;border-bottom:1px solid #d6c49e;color:#6B4B50;font:italic 17px/1.5 Georgia,serif}.wisdom-label{display:block;margin-bottom:7px;color:#9a7945;font:9px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}.small{font:11px Arial,sans-serif;color:#7c8176;line-height:1.5}.tag{display:inline-block;margin-top:18px;padding:8px 13px;border-radius:30px;background:#e8ddc4;color:#655330;font:10px Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase}
@media(max-width:760px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.door{min-height:104px}.door .num{font-size:38px}}
@media(max-width:430px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.door{min-height:96px}.door .num{font-size:35px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><img class="brand-logo" src="https://raw.githubusercontent.com/KuvagCR/kuvag-sifrovacky/main/logo%20bez%20pozad%C3%AD.png" alt="Logo KUVAG">

<h1>Adventní kalendář</h1>
<div class="rule"></div>
<p>Každý den jedno okénko a dva výherci.</p>
<div class="countdown" id="countdown" aria-live="polite"></div>
</header>
<section class="grid" id="calendar" aria-label="Adventní kalendář"></section>
<p class="note">Otevřete si okénko a zjistěte, komu dnes přálo štěstí.</p>
<footer>VÁNOČNÍ PŘEKVAPENÍ 2026 · KUVAG</footer>
</main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
<div class="panel">
<button class="close" id="close" aria-label="Zavřít">×</button>
<div class="day" id="modalDay">ADVENTNÍ PŘEKVAPENÍ</div>
<h2 id="modalTitle">Dnešními výherci se stávají…</h2>
<p class="intro" id="modalIntro">Gratulujeme dnešním šťastlivcům!</p>
<div class="winners" id="winners"></div>
<div class="giftname" id="gift"></div>
<div class="wisdom"><span class="wisdom-label">Myšlenka dne</span><span id="wisdomText"></span></div>
<div class="tag">Krásný advent a hodně štěstí</div>
</div>
</div>
<script>
const demo = [
["Jana Nováková","Petr Svoboda","Dárkový hrnek","☕"],
["Lucie Dvořáková","Martin Černý","Vonná svíčka","🕯️"],
["Eva Procházková","Tomáš Kučera","Kosmetická sada","🎀"],
["Anna Veselá","David Horák","Zimní čajový balíček","🍵"]
];
const sayings = [
  "Nejkrásnější dárek je chvíle, kterou někomu věnujeme.",
  "I malá laskavost dokáže rozzářit celý den.",
  "Radost roste, když se o ni rozdělíme.",
  "To nejcennější, co můžeme dát, není věc, ale pozornost.",
  "Společně zvládneme víc než každý sám.",
  "Úsměv nic nestojí, a přesto může mít velkou hodnotu.",
  "Vděčnost promění obyčejný den v něco výjimečného.",
  "Kdo umí potěšit druhé, obohacuje i svůj vlastní svět.",
  "Každý dobrý skutek zanechá stopu.",
  "Někdy stačí zpomalit, abychom si všimli toho krásného.",
  "Nezáleží na velikosti kroku, ale na směru, kterým jdeme.",
  "Přátelská slova zahřejí i v nejchladnějším dni.",
  "Úspěch chutná nejlépe, když ho můžeme sdílet.",
  "Trpělivost a laskavost dokážou víc než spěch.",
  "Každý den nabízí novou příležitost udělat něco hezkého.",
  "Domov tvoří lidé, se kterými je nám dobře.",
  "To, co děláme s radostí, přináší radost i ostatním.",
  "I malá pomoc může někomu ulehčit celý den.",
  "Nejlepší chvíle často vznikají z těch nejobyčejnějších okamžiků.",
  "Vánoční kouzlo začíná tam, kde myslíme jeden na druhého.",
  "Poděkování je maličkost, která dokáže hodně.",
  "Když si navzájem nasloucháme, nacházíme společnou cestu.",
  "Štěstí není mít všechno, ale umět ocenit to důležité.",
  "To nejhezčí z Vánoc si neodnášíme v tašce, ale v srdci."
];
const calendar=document.getElementById("calendar");
const doors=[];
const pragueDateKey=()=>{const p=new Intl.DateTimeFormat("en-CA",{timeZone:"Europe/Prague",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());const v=Object.fromEntries(p.map(x=>[x.type,x.value]));return `${v.year}-${v.month}-${v.day}`;};
function refreshCalendar(){
 const today=pragueDateKey();
 doors.forEach(({button,day})=>{
  const unlockKey=`2026-12-${String(day).padStart(2,"0")}`;
  const previewUnlock=today<"2026-12-01" && day<=2;;
  const unlocked=previewUnlock || today>=unlockKey;
  button.classList.toggle("locked",!unlocked);
  button.classList.toggle("opened",unlocked);
  button.disabled=!unlocked;
  button.querySelector(".hint").textContent=previewUnlock?"Ukázka":(unlocked?"Otevřít":"Zamčeno");
  button.setAttribute("aria-label",unlocked?`Otevřít ${day}. prosince`:`${day}. prosince – zamčeno do správného dne`);
 });
}
for(let day=1;day<=24;day++){
 const b=document.createElement("button");b.className="door locked";b.type="button";
 b.innerHTML='<span class="num">'+day+'</span><span class="hint">Zamčeno</span>';
 b.addEventListener("click",()=>{if(!b.disabled)openDay(day)});calendar.appendChild(b);doors.push({button:b,day});
}
function updateCountdown(){
 const target=Date.UTC(2026,11,24)-60*60*1000;let diff=target-Date.now();
 const el=document.getElementById("countdown");
 if(diff<=0){el.innerHTML='<span><b>🎄</b><small>Veselé Vánoce!</small></span>';return}
 const days=Math.floor(diff/86400000);diff%=86400000;const hours=Math.floor(diff/3600000);diff%=3600000;const minutes=Math.floor(diff/60000);const seconds=Math.floor((diff%60000)/1000);
 el.innerHTML=`<span><b>${days}</b><small>Dní</small></span><span><b>${String(hours).padStart(2,"0")}</b><small>Hodin</small></span><span><b>${String(minutes).padStart(2,"0")}</b><small>Minut</small></span><span><b>${String(seconds).padStart(2,"0")}</b><small>Sekund</small></span>`;
}
refreshCalendar();updateCountdown();setInterval(()=>{refreshCalendar();updateCountdown()},1000);
function openDay(day){
 const today=pragueDateKey();const unlock=Date.UTC(2026,11,day)-60*60*1000;const previewUnlock=today<"2026-12-01" && day<=2;if(Date.now()<unlock && !previewUnlock)return;
 const item=demo[(day-1)%demo.length];
 document.getElementById("modalDay").textContent="ADVENTNÍ PŘEKVAPENÍ · "+day+". PROSINCE";
 document.getElementById("modalIntro").textContent=day<=2 && today<"2026-12-01"?"PREZENTAČNÍ UKÁZKA · JMÉNA I CENA JSOU SMYŠLENÉ":"Gratulujeme dnešním šťastlivcům!";
 document.getElementById("winners").innerHTML='<div class="winner"><strong>'+item[0]+'</strong></div><div class="winner"><strong>'+item[1]+'</strong></div>';
 document.getElementById("gift").textContent=item[2];
 document.getElementById("wisdomText").textContent=sayings[day-1];
 document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show")}
document.getElementById("close").addEventListener("click",closeModal);
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
</script>
</body>
</html>
